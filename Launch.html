<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NRI TDP Germany — Launch</title>
  <link rel="icon" type="image/webp" href="logos/tdp-germany-logo.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@500;700&family=Ramabhadra&family=Tiro+Telugu&display=swap" rel="stylesheet" />
  <style>
    :root{ --gold:#FDB813; --orange:#F36F21; --red:#E2231A; --cyan:#38e0ff; }
    *{ margin:0; padding:0; box-sizing:border-box; }
    html,body{ height:100%; }
    body{ background:#03040a; color:#fff; font-family:'Poppins',system-ui,sans-serif; overflow:hidden; position:relative; }
    canvas#warp{ position:fixed; inset:0; z-index:0; display:block; }
    .vig{ position:fixed; inset:0; z-index:1; pointer-events:none; background:radial-gradient(62% 62% at 50% 50%, transparent 38%, rgba(3,4,10,.62)); }

    .site-url{ position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:10; text-decoration:none;
      font-family:'Orbitron'; font-weight:700; letter-spacing:1.5px; font-size:clamp(.62rem,2vw,.8rem);
      color:#1c1408; background:linear-gradient(135deg,#FDB813,#F36F21); padding:7px 18px; border-radius:999px;
      white-space:nowrap; box-shadow:0 0 22px rgba(253,184,19,.6); animation:urlGlow 2.2s ease-in-out infinite; }
    @keyframes urlGlow{ 0%,100%{box-shadow:0 0 16px rgba(253,184,19,.5)} 50%{box-shadow:0 0 34px rgba(253,184,19,.95)} }

    .frame i{ position:fixed; width:26px; height:26px; border:2px solid rgba(253,184,19,.5); z-index:9; pointer-events:none; }
    .frame .tl{top:16px;left:16px;border-right:0;border-bottom:0} .frame .tr{top:16px;right:16px;border-left:0;border-bottom:0}
    .frame .bl{bottom:16px;left:16px;border-right:0;border-top:0} .frame .br{bottom:16px;right:16px;border-left:0;border-top:0}

    .pbar{ position:fixed; left:0; bottom:0; height:3px; width:0; z-index:9;
      background:linear-gradient(90deg,var(--gold),var(--orange),var(--red)); box-shadow:0 0 12px var(--gold); transition:width .2s linear; }

    .stage{ position:fixed; inset:0; z-index:5; display:grid; place-items:center; text-align:center; padding:20px; pointer-events:none; opacity:0; transition:opacity .45s ease; }
    .stage.show{ opacity:1; pointer-events:auto; }

    /* START */
    #start .logo{ width:118px; height:118px; border-radius:50%; object-fit:cover; margin:0 auto 22px; display:block;
      box-shadow:0 0 0 2px rgba(253,184,19,.6),0 0 44px 8px rgba(253,184,19,.45); animation:floaty 3.5s ease-in-out infinite; }
    @keyframes floaty{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    #start .eyebrow{ font-family:'Orbitron'; letter-spacing:6px; font-size:.72rem; font-weight:700; color:var(--gold); text-transform:uppercase; opacity:.9; margin-bottom:8px; }
    #start h1{ font-family:'Orbitron'; font-weight:900; letter-spacing:3px; font-size:clamp(1.6rem,5vw,2.6rem); text-shadow:0 0 16px rgba(253,184,19,.45); }
    #start h1 b{ color:var(--red); }
    #start .telugu{ font-family:'Tiro Telugu',serif; font-size:1.1rem; margin-top:6px; color:#ffe9c2; }
    .launch-btn{ position:relative; width:210px; height:210px; margin:28px auto 12px; background:none; border:none; cursor:pointer; display:grid; place-items:center; }
    .launch-btn .ring{ position:absolute; width:124px; height:124px; border-radius:50%; border:2px solid rgba(253,184,19,.55); animation:lpulse 2.6s ease-out infinite; }
    .launch-btn .ring.r2{ animation-delay:1.3s; }
    @keyframes lpulse{ 0%{transform:scale(.85);opacity:.85} 80%{opacity:0} 100%{transform:scale(1.85);opacity:0} }
    .launch-btn .dash{ position:absolute; width:188px; height:188px; border-radius:50%; border:1px dashed rgba(56,224,255,.4); animation:spin 16s linear infinite; }
    @keyframes spin{ to{transform:rotate(360deg)} }
    .launch-btn .core{ position:relative; z-index:2; width:142px; height:142px; border-radius:50%;
      background:radial-gradient(circle at 50% 32%,#FFD45A,#F36F21 56%,#E2231A); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
      box-shadow:0 0 0 4px rgba(255,255,255,.12),0 0 48px 10px rgba(243,111,33,.6); transition:transform .25s,box-shadow .25s; }
    .launch-btn:hover .core{ transform:scale(1.06); box-shadow:0 0 0 6px rgba(255,255,255,.2),0 0 72px 18px rgba(243,111,33,.85); }
    .launch-btn:active .core{ transform:scale(.95); }
    .launch-btn .ic{ font-size:1.9rem; line-height:1; }
    .launch-btn .lbl{ font-family:'Orbitron'; font-weight:900; letter-spacing:2px; font-size:1.05rem; color:#2a1400; }
    #start .hint{ font-family:'Orbitron'; letter-spacing:4px; text-transform:uppercase; font-size:.66rem; color:#cdd2e6; opacity:.8; margin-top:10px; animation:blink 2s steps(1) infinite; }
    @keyframes blink{ 50%{opacity:.2} }

    /* kinetic statements */
    #bigword span{ display:inline-block; font-family:'Orbitron'; font-weight:900; font-size:clamp(2rem,9vw,5.4rem); letter-spacing:2px;
      color:#fff; text-shadow:0 0 30px rgba(253,184,19,.6),0 0 64px rgba(226,35,26,.3); }
    #bigword.in span{ animation:slam .9s cubic-bezier(.2,.9,.2,1) forwards; }
    @keyframes slam{ 0%{opacity:0;transform:scale(2.6);filter:blur(16px)} 35%{opacity:1;transform:scale(1);filter:blur(0)} 80%{opacity:1} 100%{opacity:0;transform:scale(.94)} }

    /* leaders */
    #lead .lab{ font-family:'Orbitron'; letter-spacing:5px; font-size:.74rem; color:var(--gold); text-transform:uppercase; margin-bottom:24px; opacity:.9; }
    #lead .row{ display:flex; justify-content:center; gap:clamp(16px,5vw,48px); flex-wrap:wrap; }
    #lead .c{ width:clamp(120px,24vw,168px); opacity:0; transform:scale(.6); }
    #lead.show .c{ animation:pop .7s cubic-bezier(.2,.85,.2,1) forwards; }
    #lead.show .c:nth-child(1){animation-delay:.1s} #lead.show .c:nth-child(2){animation-delay:.4s} #lead.show .c:nth-child(3){animation-delay:.7s}
    @keyframes pop{ to{opacity:1;transform:none} }
    #lead .ph{ width:100%; aspect-ratio:1; border-radius:50%; overflow:hidden; border:3px solid rgba(56,224,255,.55);
      box-shadow:0 0 0 4px rgba(253,184,19,.2),0 0 34px 6px rgba(56,224,255,.4); }
    #lead .ph img{ width:100%; height:100%; object-fit:cover; }
    #lead .nm{ font-family:'Orbitron'; font-weight:700; font-size:.82rem; margin-top:12px; }
    #lead .rl{ font-size:.62rem; color:var(--cyan); text-transform:uppercase; margin-top:2px; }

    /* full-screen countdown */
    #countnum span{ font-family:'Orbitron'; font-weight:900; font-size:clamp(7rem,38vw,20rem); line-height:1; color:#fff;
      text-shadow:0 0 60px rgba(253,184,19,.85),0 0 120px rgba(243,111,33,.5); }
    #countnum.tick span{ animation:bignum 1s ease forwards; }
    @keyframes bignum{ 0%{opacity:0;transform:scale(2.3);filter:blur(12px)} 22%{opacity:1;transform:scale(1);filter:blur(0)} 100%{opacity:0;transform:scale(.82)} }
    #countnum.final span{ color:#ff5a4d; text-shadow:0 0 60px rgba(226,35,26,1),0 0 130px rgba(226,35,26,.6); }

    /* reveal */
    #reveal .inner{ position:relative; }
    #reveal .burst{ position:absolute; left:50%; top:46%; transform:translate(-50%,-50%); z-index:-1; width:min(860px,94vw); aspect-ratio:1; border-radius:50%;
      background:radial-gradient(circle,rgba(253,184,19,.42),rgba(243,111,33,.16) 38%,transparent 68%); filter:blur(28px); animation:burstPulse 2.6s ease-in-out infinite; }
    @keyframes burstPulse{ 0%,100%{opacity:.6;transform:translate(-50%,-50%) scale(.9)} 50%{opacity:1;transform:translate(-50%,-50%) scale(1.1)} }
    #reveal .photos{ display:flex; justify-content:center; align-items:center; margin-bottom:28px; }
    #reveal .pc{ width:clamp(150px,28vw,300px); aspect-ratio:3/2; object-fit:cover; border-radius:16px; border:3px solid rgba(253,184,19,.9);
      box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 40px rgba(253,184,19,.6); background:#111; }
    #reveal .pc.l{ transform:rotate(-6deg); } #reveal .pc.r{ transform:rotate(6deg); margin-left:-24px; }
    #reveal .te{ font-family:'Ramabhadra',sans-serif; font-size:clamp(3.4rem,15vw,8rem); line-height:1.1; color:#FFE08A;
      text-shadow:0 0 24px rgba(253,184,19,.95),0 0 60px rgba(243,111,33,.55); animation:tePulse 2.4s ease-in-out infinite; }
    @keyframes tePulse{ 0%,100%{text-shadow:0 0 22px rgba(253,184,19,.85),0 0 50px rgba(243,111,33,.45)} 50%{text-shadow:0 0 34px rgba(253,184,19,1),0 0 80px rgba(243,111,33,.7)} }
    #reveal .div{ display:block; width:clamp(120px,30vw,220px); height:2px; margin:24px auto; background:linear-gradient(90deg,transparent,var(--gold),var(--red),transparent); box-shadow:0 0 14px rgba(253,184,19,.8); }
    #reveal .en{ font-family:'Orbitron'; font-weight:700; letter-spacing:4px; text-transform:uppercase; font-size:clamp(.78rem,2.6vw,1.15rem); line-height:1.7; color:#ffe9c2; }

    /* blast fx */
    .flash{ position:fixed; inset:0; z-index:7; pointer-events:none; opacity:0; background:radial-gradient(circle at 50% 50%,#fff 0%,#fff 25%,var(--gold) 55%,var(--red) 95%); }
    body.blast .flash{ animation:flash 1s ease forwards; }
    @keyframes flash{ 0%{opacity:0} 12%{opacity:1} 40%{opacity:1} 100%{opacity:0} }
    .shockwave{ position:fixed; left:50%; top:50%; transform:translate(-50%,-50%) scale(.2); z-index:8; pointer-events:none; width:60px; height:60px; border-radius:50%; border:8px solid rgba(255,255,255,.95); opacity:0; box-shadow:0 0 40px rgba(253,184,19,.8); }
    .shockwave.go{ animation:shock 1s cubic-bezier(.12,.7,.2,1) forwards; }
    @keyframes shock{ 0%{opacity:.95;transform:translate(-50%,-50%) scale(.15);border-width:10px} 70%{opacity:.5} 100%{opacity:0;transform:translate(-50%,-50%) scale(46);border-width:1px} }
    body.bigshake{ animation:bigshake .6s cubic-bezier(.36,.07,.19,.97); }
    @keyframes bigshake{ 10%{transform:translate(-7px,4px)} 25%{transform:translate(8px,-5px)} 40%{transform:translate(-9px,3px)} 55%{transform:translate(7px,5px)} 70%{transform:translate(-5px,-3px)} 85%{transform:translate(4px,2px)} 100%{transform:none} }

    .audio-btn{ position:fixed; bottom:18px; left:18px; z-index:9; width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.08); border:1px solid rgba(253,184,19,.45); color:#fff; font-size:1.1rem; cursor:pointer; display:grid; place-items:center; }
    .skip-fixed{ position:fixed; bottom:18px; right:18px; z-index:9; background:rgba(255,255,255,.08); color:#cdd2e6; border:1px solid rgba(253,184,19,.45); font-family:'Orbitron'; font-size:.6rem; letter-spacing:1px; text-transform:uppercase; padding:8px 14px; border-radius:999px; cursor:pointer; opacity:0; transition:.3s; }
    body.started .skip-fixed{ opacity:1; }

    @media (max-width:640px){ .frame i{display:none;} }
    @media (prefers-reduced-motion:reduce){ #start .logo,.launch-btn .ring,.launch-btn .dash{animation:none;} }
  </style>
</head>
<body>
  <canvas id="warp"></canvas>
  <div class="vig"></div>
  <div class="frame"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
  <a class="site-url" href="https://www.tdpgermany.org" target="_blank" rel="noopener">🌐 www.tdpgermany.org</a>

  <section class="stage show" id="start">
    <div>
      <img class="logo" src="logos/tdp-germany-logo.webp" alt="TDP Germany logo" />
      <div class="eyebrow">NRI TDP Germany</div>
      <h1>LAUNCH <b>READY</b></h1>
      <div class="telugu">తెలుగుదేశం పార్టీ — జర్మనీ విభాగం</div>
      <button class="launch-btn" id="launchBtn" type="button" aria-label="Launch">
        <span class="ring"></span><span class="ring r2"></span><span class="dash"></span>
        <span class="core"><span class="ic">🚀</span><span class="lbl">LAUNCH</span></span>
      </button>
      <div class="hint">Press to begin</div>
    </div>
  </section>

  <section class="stage" id="bigword"><div><span></span></div></section>

  <section class="stage" id="lead">
    <div>
      <div class="lab">Powered by their vision</div>
      <div class="row">
        <div class="c"><div class="ph"><img src="leader-photos/ntr.webp" alt="" /></div><div class="nm">Sri N. T. Rama Rao</div><div class="rl">Founder</div></div>
        <div class="c"><div class="ph"><img src="leader-photos/cbn.webp" alt="" /></div><div class="nm">Sri N. Chandrababu Naidu</div><div class="rl">National President</div></div>
        <div class="c"><div class="ph"><img src="leader-photos/lokesh.webp" alt="" /></div><div class="nm">Sri Nara Lokesh</div><div class="rl">Working President</div></div>
      </div>
    </div>
  </section>

  <section class="stage" id="countnum"><div><span>10</span></div></section>

  <section class="stage" id="reveal">
    <div class="inner">
      <span class="burst"></span>
      <div class="photos">
        <img class="pc l" src="welcome-photos/welcome-cbn.webp" alt="NRI TDP Germany welcomes Chandrababu Naidu" />
        <img class="pc r" src="welcome-photos/welcome-lokesh.webp" alt="NRI TDP Germany welcomes Nara Lokesh" />
      </div>
      <div class="te">స్వాగతం</div>
      <span class="div"></span>
      <div class="en">Welcome to<br />NRI TDP Germany</div>
    </div>
  </section>

  <div class="flash"></div>
  <div class="shockwave" id="shockwave"></div>
  <div class="pbar" id="pbar"></div>

  <audio id="bgm" src="mp3/bgm1.mp3" preload="auto"></audio>
  <button class="audio-btn" id="audioBtn" type="button" aria-label="Toggle sound">🔊</button>
  <button class="skip-fixed" id="skipFixed" type="button">Skip →</button>

  <script>
    // ===== Hyperspace warp starfield =====
    var warp = (function () {
      var c = document.getElementById('warp'), x = c.getContext('2d'), dpr = window.devicePixelRatio || 1, W, H, cx, cy, stars = [], speed = 0.5, target = 0.5;
      var CL = ['rgba(253,200,90,', 'rgba(243,111,33,', 'rgba(255,255,255,', 'rgba(56,224,255,'];
      function size(){ W = innerWidth; H = innerHeight; c.width = W * dpr; c.height = H * dpr; x.setTransform(dpr,0,0,dpr,0,0); cx = W/2; cy = H/2; }
      size(); addEventListener('resize', size);
      function ns(init){ return { x:(Math.random()*2-1)*W, y:(Math.random()*2-1)*H, z: init ? Math.random()*W : W, pz:0, c: CL[(Math.random()*CL.length)|0] }; }
      for (var i=0;i<440;i++) stars.push(ns(true));
      (function loop(){
        speed += (target - speed) * 0.05;
        x.fillStyle = 'rgba(3,4,10,' + (speed > 5 ? 0.2 : 0.45) + ')'; x.fillRect(0,0,W,H);
        for (var i=0;i<stars.length;i++){ var s = stars[i]; s.pz = s.z; s.z -= speed;
          if (s.z < 1){ stars[i] = ns(false); continue; }
          var sx = s.x/s.z*W + cx, sy = s.y/s.z*H + cy, px = s.x/s.pz*W + cx, py = s.y/s.pz*H + cy;
          var k = 1 - s.z/W, r = Math.max(.4, k*2.6);
          x.strokeStyle = s.c + Math.min(1, k + .15) + ')'; x.lineWidth = r;
          x.beginPath(); x.moveTo(px,py); x.lineTo(sx,sy); x.stroke();
        }
        requestAnimationFrame(loop);
      })();
      return { speed: function(v){ target = v; } };
    })();

    // ===== Music =====
    var BGM = (function () {
      var a = document.getElementById('bgm'), btn = document.getElementById('audioBtn');
      if (!a) return {};
      a.volume = 0.55;
      function start(){ if (a.muted) return; var p = a.play(); if (p && p.catch) p.catch(function(){}); }
      if (btn) btn.addEventListener('click', function(e){ e.stopPropagation(); a.muted = !a.muted; btn.textContent = a.muted ? '🔇' : '🔊'; if (!a.muted) start(); });
      return { start: start, el: a };
    })();

    function show(id){ document.querySelectorAll('.stage').forEach(function(s){ if (s.id !== id) s.classList.remove('show'); }); var e = document.getElementById(id); if (e) e.classList.add('show'); }
    function shock(){ var s = document.getElementById('shockwave'); s.classList.remove('go'); void s.offsetWidth; s.classList.add('go'); }
    var pbar = document.getElementById('pbar');

    // ===== Cinematic sequence =====
    (function () {
      var STATEMENTS = ['FAR FROM HOME', 'WE STAND TOGETHER', 'ONE TELUGU VOICE', 'NRI TDP GERMANY'];
      var START_COUNT = 10, STMT_MS = 950, LEAD_MS = 3200;
      var bigEl = document.getElementById('bigword'), leadEl = document.getElementById('lead'),
          numEl = document.getElementById('countnum'), bigSpan = bigEl.querySelector('span'), numSpan = numEl.querySelector('span');
      var started = false, done = false, t0 = 0, TOTAL = 0;

      function progress(){ if (done) return; var p = Math.min(100, (performance.now()-t0)/TOTAL*100); pbar.style.width = p + '%'; if (p < 100) requestAnimationFrame(progress); }

      function begin(){
        if (started) return; started = true; document.body.classList.add('started');
        if (BGM.start) BGM.start();
        warp.speed(22);
        TOTAL = STATEMENTS.length*STMT_MS + LEAD_MS + START_COUNT*1000; t0 = performance.now(); progress();
        runStatements(0);
      }

      function runStatements(i){
        if (done) return;
        if (i >= STATEMENTS.length){ runLeaders(); return; }
        show('bigword'); bigSpan.textContent = STATEMENTS[i];
        bigEl.classList.remove('in'); void bigEl.offsetWidth; bigEl.classList.add('in'); shock();
        setTimeout(function(){ runStatements(i+1); }, STMT_MS);
      }

      function runLeaders(){
        if (done) return;
        warp.speed(6); show('lead');
        leadEl.classList.remove('show'); void leadEl.offsetWidth; leadEl.classList.add('show');
        setTimeout(startCountdown, LEAD_MS);
      }

      function startCountdown(){
        if (done) return;
        warp.speed(15); show('countnum');
        var n = START_COUNT;
        function tickShow(){
          numSpan.textContent = n; numEl.classList.toggle('final', n <= 3);
          numEl.classList.remove('tick'); void numEl.offsetWidth; numEl.classList.add('tick');
          if (n <= 3){ shock(); warp.speed(22 + (4-n)*5);
            document.body.classList.remove('bigshake'); void document.body.offsetWidth; document.body.classList.add('bigshake'); }
        }
        tickShow();
        var iv = setInterval(function(){ n--; if (n <= 0){ clearInterval(iv); blast(); return; } tickShow(); }, 1000);
      }

      function blast(){
        done = true; pbar.style.width = '100%';
        warp.speed(75);
        document.body.classList.add('blast');
        shock(); setTimeout(shock, 180);
        document.body.classList.remove('bigshake'); void document.body.offsetWidth; document.body.classList.add('bigshake');
        show('reveal');
        setTimeout(function(){ warp.speed(2); }, 550);
        try { sessionStorage.setItem('tdpLaunch','1'); } catch(e){}
        setTimeout(function(){
          try { if (BGM.el) sessionStorage.setItem('tdpMusicTime', String(BGM.el.currentTime || 0)); } catch(e){}
          window.location.href = 'index.html';
        }, 3000);
      }

      document.getElementById('launchBtn').addEventListener('click', begin);
      function skip(){ if (!started){ begin(); return; } if (!done) blast(); }
      document.getElementById('skipFixed').addEventListener('click', skip);
    })();
  </script>
</body>
</html>
