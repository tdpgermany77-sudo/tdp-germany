<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NRI TDP Germany — Launching…</title>
  <link rel="icon" type="image/webp" href="logos/tdp-germany-logo.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&family=Tiro+Telugu&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', system-ui, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; color: #fff; overflow: hidden; position: relative;
      background: linear-gradient(135deg, #FDB813 0%, #F7941E 50%, #F36F21 100%);
    }
    /* soft moving glow */
    body::before {
      content: ''; position: absolute; inset: -20%;
      background: radial-gradient(40% 50% at 50% 30%, rgba(255,255,255,.35), transparent 70%);
      animation: pulseBg 4s ease-in-out infinite;
    }
    @keyframes pulseBg { 0%,100% { opacity: .6; } 50% { opacity: 1; } }
    .launch { position: relative; z-index: 1; padding: 24px; }
    .launch__logo {
      width: 150px; height: 150px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 22px;
      box-shadow: 0 0 0 5px rgba(255,255,255,.7), 0 0 50px 12px rgba(255,255,255,.55);
      animation: floaty 3s ease-in-out infinite;
    }
    @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .launch h1 {
      font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 800; line-height: 1.05;
      text-shadow: 0 4px 18px rgba(0,0,0,.2);
    }
    .launch h1 span { color: #8B0000; }
    .launch__telugu { font-family: 'Tiro Telugu', serif; font-size: 1.3rem; margin: 8px 0 4px; }
    .launch__hint { font-weight: 500; opacity: .95; letter-spacing: 3px; text-transform: uppercase; font-size: .8rem; margin-top: 28px; }
    .count {
      margin: 14px auto 0; width: clamp(120px, 34vw, 180px); height: clamp(120px, 34vw, 180px);
      display: grid; place-items: center; border-radius: 50%;
      background: rgba(255,255,255,.18); border: 3px solid rgba(255,255,255,.6);
      font-size: clamp(3.5rem, 12vw, 6rem); font-weight: 800; color: #fff;
      text-shadow: 0 4px 16px rgba(0,0,0,.25);
    }
    .count.pop { animation: pop .5s ease; }
    @keyframes pop { 0% { transform: scale(.6); opacity: .2; } 55% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
    .skip {
      position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 2;
      background: rgba(255,255,255,.9); color: #c41a12; border: none; cursor: pointer;
      font: inherit; font-weight: 700; padding: 10px 22px; border-radius: 999px;
    }
    @media (prefers-reduced-motion: reduce) {
      body::before, .launch__logo, .count.pop { animation: none; }
    }
  </style>
</head>
<body>
  <div class="launch">
    <img class="launch__logo" src="logos/tdp-germany-logo.webp" alt="TDP Germany logo" />
    <h1>NRI TDP <span>Germany</span></h1>
    <p class="launch__telugu">తెలుగుదేశం పార్టీ — జర్మనీ విభాగం</p>
    <div class="count pop" id="count">10</div>
    <p class="launch__hint">Launching in…</p>
  </div>
  <button class="skip" id="skip" type="button">Enter now →</button>

  <script>
    (function () {
      var n = 10;
      var el = document.getElementById('count');
      el.textContent = n;

      function go() {
        try { sessionStorage.setItem('tdpLaunch', '1'); } catch (e) {}
        window.location.href = 'index.html';
      }

      var iv = setInterval(function () {
        n--;
        if (n <= 0) { clearInterval(iv); go(); return; }
        el.textContent = n;
        el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
      }, 1000);

      document.getElementById('skip').addEventListener('click', function () {
        clearInterval(iv);
        go();
      });
    })();
  </script>
</body>
</html>
